<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control de Asistencia y Notas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="card">
    <h2>Control de Asistencia y Notas</h2>

    <form id="notaForm">
      <label>Nombre del Estudiante:</label>
      <input type="text" id="nombre" required>

      <label>Curso:</label>
      <input type="text" id="curso" required>

      <label>Nota Final:</label>
      <input type="number" id="nota" min="0" max="20" step="0.1" required>

      <label>Clases Totales:</label>
      <input type="number" id="totalClases" min="1" required>

      <label>Inasistencias:</label>
      <input type="number" id="inasistencias" min="0" required>

      <button type="submit">Calcular</button>
    </form>

    <div id="resultado" class="resultado hidden">
      <p><strong>Estudiante:</strong> <span id="resNombre"></span></p>
      <p><strong>Curso:</strong> <span id="resCurso"></span></p>
      <p><strong>Nota Definitiva:</strong> <span id="resNota" class="nota-numero"></span></p>
      <p><strong>Anotación:</strong> <span id="resAnotacion"></span></p>
    </div>
  </div>

  <script src="uno.js"></script>
</body>
</html>
